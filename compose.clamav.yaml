services:
  bookguard:
    depends_on:
      - clamav
    environment:
      # Including this overlay is the explicit malware-scanning opt-in.
      BOOKGUARD_VERIFICATION_MALWARE_SCAN: "true"
      BOOKGUARD_CLAMD_HOST: clamav
      BOOKGUARD_CLAMD_PORT: "3310"

  clamav:
    image: ${BOOKGUARD_CLAMAV_IMAGE:-clamav/clamav:1.5.4}
    container_name: bookguard-clamav
    restart: unless-stopped
    environment:
      # clamd defaults to 100 MiB and drops larger streams mid-upload (seen as
      # "Broken pipe"). Match BookGuard's BOOKGUARD_MALWARE_MAX_BYTES (512 MiB).
      # The image writes CLAMD_CONF_* into clamd.conf at start; for these
      # single-value options clamd keeps the first occurrence.
      CLAMD_CONF_StreamMaxLength: ${BOOKGUARD_CLAMD_STREAM_MAX_LENGTH:-512M}
      CLAMD_CONF_MaxFileSize: ${BOOKGUARD_CLAMD_MAX_FILE_SIZE:-512M}
      CLAMD_CONF_MaxScanSize: ${BOOKGUARD_CLAMD_MAX_SCAN_SIZE:-1024M}
      # The image checks for new virus definitions once a day by default, so
      # scans ran up to a day or more behind ClamAV's daily releases. 12 checks a
      # day (every two hours) matches freshclam's own default and stays within
      # ClamAV's guidance of no more than hourly checks.
      FRESHCLAM_CHECKS: ${BOOKGUARD_FRESHCLAM_CHECKS:-12}
    security_opt:
      - no-new-privileges:true
    # Deliberately no host-published ports and no media mounts. BookGuard
    # streams bytes to clamd over the private Compose network.
    volumes:
      - bookguard-clamav-db:/var/lib/clamav

volumes:
  bookguard-clamav-db:
