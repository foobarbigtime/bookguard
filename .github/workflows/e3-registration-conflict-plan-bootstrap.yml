name: e3-registration-conflict-plan-bootstrap

on:
  push:
    branches:
      - feature/e3-registration-conflict-plan
    paths:
      - .github/workflows/e3-registration-conflict-plan-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply narrow E3 planning changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          observe = Path('app/observe.py')
          text = observe.read_text()
          old = '''        else:\n            recovery = classify_admission_failure(\n                status,\n                str(row["error"] or ""),\n                str(row["publication_method"] or ""),\n            )\n'''
          new = '''        elif status == "registration_conflict":\n            decisions.append(_decision(\n                **common,\n                state=status,\n                decision="would_correct_registration_conflict",\n                reason_code="REGISTRATION_CONFLICT",\n                reason=(\n                    "Bindery assigns the admitted ebook's exact published path to a "\n                    "different book, while BookGuard retains the intended admission "\n                    "identity and staged snapshot."\n                ),\n                next_step=(\n                    "Observe Mode records the guarded exact-path ownership correction "\n                    "plan only. It does not remove a queue record, change Bindery import "\n                    "mode, reassign ownership, or alter library/staged bytes."\n                ),\n                evidence=evidence,\n            ))\n        else:\n            recovery = classify_admission_failure(\n                status,\n                str(row["error"] or ""),\n                str(row["publication_method"] or ""),\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'observe anchor count={text.count(old)}')
          observe.write_text(text.replace(old, new, 1))

          planner = Path('app/recovery_planner.py')
          text = planner.read_text()
          old = '''    "would_reconcile_admission",\n    "would_finalize_acquisition",\n'''
          new = '''    "would_reconcile_admission",\n    "would_correct_registration_conflict",\n    "would_finalize_acquisition",\n'''
          if text.count(old) != 1:
              raise SystemExit(f'planner decision anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    if action == "would_finalize_acquisition":\n'''
          new = '''    if action == "would_correct_registration_conflict":\n        return (\n            "CORRECT_REGISTRATION_CONFLICT",\n            str(decision.get("reasonCode") or "REGISTRATION_CONFLICT"),\n            [\n                _step(\n                    "revalidate_registration_conflict",\n                    "Re-read the durable admission, exact published/staged byte identity, current Bindery owner, queue state, import mode, and intended book identity.",\n                    stop_if_unproven=True,\n                ),\n                _step(\n                    "correct_exact_registration_owner",\n                    "Run only the existing guarded no-move correction transaction: preserve library/staged bytes, never remove download-client data, and restore external import mode after exact ownership reassignment.",\n                    external_mutation=True,\n                    stop_if_unproven=True,\n                ),\n                _step(\n                    "verify_registration_correction",\n                    "Independently prove the exact path belongs only to the intended book, external import mode is restored, auto-grab remains disabled, and both byte copies still match the verified SHA-256.",\n                    stop_if_unproven=True,\n                ),\n            ],\n        )\n\n    if action == "would_finalize_acquisition":\n'''
          if text.count(old) != 1:
              raise SystemExit(f'planner definition anchor count={text.count(old)}')
          planner.write_text(text.replace(old, new, 1))

          Path('tests/test_e3_registration_conflict_plan.py').write_text('''from __future__ import annotations\n\nfrom app.config import settings\nfrom app.db import (\n    add_result,\n    create_ebook_admission,\n    create_scan,\n    finish_scan,\n    init_local_db,\n    local_conn,\n    result_by_id,\n    update_ebook_admission,\n)\nfrom app.observe import run_observe_cycle\nfrom app.verifier import init_verification_db\n\n\ndef _seed_admission(tmp_path, *, status: str) -> str:\n    original = settings.config_dir\n    settings.config_dir = str(tmp_path / "config")\n    init_local_db()\n    init_verification_db()\n\n    create_scan("registration-conflict-plan", 1)\n    add_result(\n        "registration-conflict-plan",\n        {\n            "file_id": 501,\n            "book_id": 701,\n            "author": "Expected Author",\n            "title": "Expected Book",\n            "format": "ebook",\n            "stored_path": "/data/media/books/Expected Book/Expected Book.epub",\n            "local_path": "/books/Expected Book/Expected Book.epub",\n            "classification": "PASS",\n            "risk_score": 0,\n            "reason_code": "OK",\n            "reasons": [],\n            "metadata": {},\n        },\n    )\n    finish_scan("registration-conflict-plan")\n\n    with local_conn() as conn:\n        result_id = int(\n            conn.execute(\n                "SELECT id FROM scan_results WHERE scan_id='registration-conflict-plan'"\n            ).fetchone()["id"]\n        )\n    result = result_by_id(result_id)\n    assert result is not None\n    admission_id = create_ebook_admission(\n        result,\n        "Expected Book/Expected Book.epub",\n    )\n    update_ebook_admission(\n        admission_id,\n        status,\n        staged_sha256="a" * 64,\n        publication_method="renameat2",\n        error="exact path belongs to the wrong Bindery book",\n    )\n    return original\n\n\ndef test_registration_conflict_earns_nonexecuting_e3_plan(monkeypatch, tmp_path):\n    original = _seed_admission(tmp_path, status="registration_conflict")\n    try:\n        monkeypatch.setenv("BOOKGUARD_AUTOMATION_MODE", "observe")\n        observed = run_observe_cycle()\n    finally:\n        settings.config_dir = original\n\n    assert observed["decisionCount"] == 1\n    record = observed["records"][0]\n    assert record["subjectKind"] == "admission"\n    assert record["decision"] == "would_correct_registration_conflict"\n    assert record["reasonCode"] == "REGISTRATION_CONFLICT"\n\n    assert observed["planCount"] == 1\n    plan = observed["plans"][0]\n    assert plan["subjectKind"] == "admission"\n    assert plan["planKind"] == "CORRECT_REGISTRATION_CONFLICT"\n    assert plan["reasonCode"] == "REGISTRATION_CONFLICT"\n    assert plan["executionAllowed"] is False\n    assert [step["code"] for step in plan["steps"]] == [\n        "revalidate_registration_conflict",\n        "correct_exact_registration_owner",\n        "verify_registration_correction",\n    ]\n    assert plan["steps"][1]["externalMutation"] is True\n\n\ndef test_interrupted_registration_correction_remains_attention(monkeypatch, tmp_path):\n    original = _seed_admission(tmp_path, status="registration_correcting")\n    try:\n        monkeypatch.setenv("BOOKGUARD_AUTOMATION_MODE", "observe")\n        observed = run_observe_cycle()\n    finally:\n        settings.config_dir = original\n\n    assert observed["decisionCount"] == 1\n    record = observed["records"][0]\n    assert record["decision"] == "attention"\n    assert record["reasonCode"] == "REGISTRATION_CORRECTION_INTERRUPTED"\n    assert observed["planCount"] == 0\n''')
          PY

      - name: Install test dependencies
        run: pip install -r requirements.txt pytest httpx ruff==0.12.11

      - name: Validate generated slice
        run: |
          ruff check app/observe.py app/recovery_planner.py tests/test_e3_registration_conflict_plan.py
          PYTHONPATH=. pytest -q tests/test_e3_registration_conflict_plan.py tests/test_observe.py tests/test_recovery_planner.py

      - name: Commit generated slice and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/e3-registration-conflict-plan-bootstrap.yml
          git config user.name "foobarbigtime"
          git config user.email "97999764+foobarbigtime@users.noreply.github.com"
          git add app/observe.py app/recovery_planner.py tests/test_e3_registration_conflict_plan.py .github/workflows/e3-registration-conflict-plan-bootstrap.yml
          git commit -m "E3: plan exact registration conflict correction"
          git push origin HEAD:feature/e3-registration-conflict-plan
