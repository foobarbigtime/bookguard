name: e4-registration-correction-bootstrap

on:
  push:
    branches:
      - feature/e4-registration-conflict-correction
    paths:
      - .github/workflows/e4-registration-correction-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire exact registration correction into E4 runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path('app/config.py')
          text = config.read_text()
          old = '''    "reconcile_known_admission",\n    "finish_guarded_cleanup",\n'''
          new = '''    "reconcile_known_admission",\n    "correct_exact_registration_owner",\n    "finish_guarded_cleanup",\n'''
          if text.count(old) != 1:
              raise SystemExit(f'config action anchor count={text.count(old)}')
          config.write_text(text.replace(old, new, 1))

          runner = Path('app/automatic_runner.py')
          text = runner.read_text()
          old = '''from .recovery_planner import _build_plan\n'''
          new = '''from .recovery_planner import _build_plan\nfrom .registration_correction import (\n    register_executor as register_registration_conflict_executor,\n    run_registration_conflict_cycle,\n)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'runner import anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''AutomaticExecutionBlocked = core.AutomaticExecutionBlocked\nautomatic_execution_history = core.automatic_execution_history\n'''
          new = '''AutomaticExecutionBlocked = core.AutomaticExecutionBlocked\nautomatic_execution_history = core.automatic_execution_history\nregister_registration_conflict_executor()\n'''
          if text.count(old) != 1:
              raise SystemExit(f'runner registration anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''                "QUARANTINE_UNSAFE_MEDIA",\n                "FINALIZE_ACQUISITION",\n'''
          new = '''                "QUARANTINE_UNSAFE_MEDIA",\n                "CORRECT_REGISTRATION_CONFLICT",\n                "FINALIZE_ACQUISITION",\n'''
          if text.count(old) != 1:
              raise SystemExit(f'runner candidate anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    if candidates and str(candidates[0].get("planKind") or "") == "FINALIZE_ACQUISITION":\n        return _run_finalization_cycle(candidates[0])\n    return core.run_automatic_cycle(limit)\n'''
          new = '''    if candidates and str(candidates[0].get("planKind") or "") == "CORRECT_REGISTRATION_CONFLICT":\n        return run_registration_conflict_cycle(candidates[0])\n    if candidates and str(candidates[0].get("planKind") or "") == "FINALIZE_ACQUISITION":\n        return _run_finalization_cycle(candidates[0])\n    return core.run_automatic_cycle(limit)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'runner dispatch anchor count={text.count(old)}')
          runner.write_text(text.replace(old, new, 1))
          PY

      - name: Install test dependencies
        run: pip install -r requirements.txt pytest httpx ruff==0.12.11

      - name: Validate E4 registration correction slice
        run: |
          ruff check app/config.py app/automatic_runner.py app/registration_correction.py tests/test_registration_correction_e4.py
          PYTHONPATH=. pytest -q tests/test_registration_correction_e4.py tests/test_e3_registration_conflict_plan.py
          PYTHONPATH=. pytest -q
          bash -n scripts/acceptance/run scripts/acceptance/lib/common.sh scripts/acceptance/scenarios/*.sh
          bash scripts/acceptance/run selftest

      - name: Commit generated wiring and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/e4-registration-correction-bootstrap.yml
          git config user.name "foobarbigtime"
          git config user.email "97999764+foobarbigtime@users.noreply.github.com"
          git add app/config.py app/automatic_runner.py app/registration_correction.py tests/test_registration_correction_e4.py .github/workflows/e4-registration-correction-bootstrap.yml
          git commit -m "E4: wire guarded registration conflict correction"
          git push origin HEAD:feature/e4-registration-conflict-correction
