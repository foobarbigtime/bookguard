name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR integration tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr
      - run: pip install -r requirements.txt pytest httpx "Pillow>=10.1" ruff==0.12.11
      - name: Require real OCR integration dependencies
        run: python -c 'import PIL, shutil; assert shutil.which("tesseract") and shutil.which("pdftoppm")'
      - run: ruff check .
      - run: PYTHONPATH=. pytest -q
      - run: bash -n scripts/acceptance/run scripts/acceptance/lib/common.sh scripts/acceptance/scenarios/*.sh
      - run: bash scripts/acceptance/run selftest
      - run: bash scripts/acceptance/run cleanup-selftest
      - run: ./scripts/smoke-test.sh
      - run: sudo scripts/acceptance/run quarantine-copy-fault
