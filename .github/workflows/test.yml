name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx ruff==0.12.11
      - run: ruff check .
      - run: PYTHONPATH=. pytest -q
      - run: bash -n scripts/acceptance/run scripts/acceptance/lib/common.sh scripts/acceptance/scenarios/*.sh
      - run: bash scripts/acceptance/run selftest
      - run: ./scripts/smoke-test.sh
      - run: sudo scripts/acceptance/run acquisition-progress
      - run: sudo scripts/acceptance/run acquisition-admission
      - run: sudo scripts/acceptance/run prepublication-retirement
      - run: sudo scripts/acceptance/run acquisition-scan
      - run: sudo scripts/acceptance/run acquisition-restart
      - run: sudo scripts/acceptance/run publication-recovery
      - run: sudo scripts/acceptance/run publication-scan
      - run: sudo scripts/acceptance/run alternate-grab
      - run: sudo scripts/acceptance/run quarantine-unsafe
