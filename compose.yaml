services:
  bookguard:
    build: .
    container_name: bookguard
    restart: unless-stopped
    ports:
      - "8788:8788"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-America/Toronto}
      BINDERY_DB: ${BINDERY_DB:-/bindery/bindery.db}
      BINDERY_URL: ${BINDERY_URL:-http://host.docker.internal:8787}
      BINDERY_API_KEY: ${BINDERY_API_KEY:-}
      AUDIOBOOK_ROOT: ${AUDIOBOOK_ROOT:-/audiobooks}
      AUDIOBOOK_BINDERY_PREFIX: ${AUDIOBOOK_BINDERY_PREFIX:-/data/media/audiobooks}
      EBOOK_ROOT: ${EBOOK_ROOT:-/books}
      EBOOK_BINDERY_PREFIX: ${EBOOK_BINDERY_PREFIX:-/data/media/books}
      CONFIG_DIR: /config
      QUARANTINE_ROOT: ${QUARANTINE_ROOT:-/quarantine}
      BOOKGUARD_STAGING_ROOT: ${BOOKGUARD_STAGING_ROOT:-/staging}
      BOOKGUARD_BINDERY_DROP_FOLDER: ${BOOKGUARD_BINDERY_DROP_FOLDER:-}
      BOOKGUARD_AUTOMATIC_REACQUISITION: ${BOOKGUARD_AUTOMATIC_REACQUISITION:-false}
      BOOKGUARD_ALLOW_ACTIONS: ${BOOKGUARD_ALLOW_ACTIONS:-false}
      BOOKGUARD_SAMPLE_FILES: ${BOOKGUARD_SAMPLE_FILES:-3}
      BOOKGUARD_SCAN_ON_START: ${BOOKGUARD_SCAN_ON_START:-false}
      BOOKGUARD_SCAN_AUDIOBOOKS: ${BOOKGUARD_SCAN_AUDIOBOOKS:-true}
      BOOKGUARD_SCAN_EBOOKS: ${BOOKGUARD_SCAN_EBOOKS:-true}
      BOOKGUARD_PROGRESS_EVERY: ${BOOKGUARD_PROGRESS_EVERY:-10}
      BOOKGUARD_TITLE_MIN_SHARED_WORDS: ${BOOKGUARD_TITLE_MIN_SHARED_WORDS:-2}
      BOOKGUARD_AUTHOR_SURNAME_MATCH: ${BOOKGUARD_AUTHOR_SURNAME_MATCH:-true}
      BOOKGUARD_REJECT_MUSIC_MISMATCH: ${BOOKGUARD_REJECT_MUSIC_MISMATCH:-true}
      BOOKGUARD_REJECT_STRONG_MISMATCH: ${BOOKGUARD_REJECT_STRONG_MISMATCH:-true}
      BOOKGUARD_STRONG_MISMATCH_MIN_SAMPLES: ${BOOKGUARD_STRONG_MISMATCH_MIN_SAMPLES:-1}
      BOOKGUARD_STRONG_MISMATCH_CONSENSUS_PERCENT: ${BOOKGUARD_STRONG_MISMATCH_CONSENSUS_PERCENT:-67}
      BOOKGUARD_METADATA_REPAIR_MODE: ${BOOKGUARD_METADATA_REPAIR_MODE:-preview}
      BOOKGUARD_REPAIR_AUDIOBOOKS: ${BOOKGUARD_REPAIR_AUDIOBOOKS:-true}
      BOOKGUARD_REPAIR_EBOOKS: ${BOOKGUARD_REPAIR_EBOOKS:-true}
      BOOKGUARD_REPAIR_NORMALIZE_PASS: ${BOOKGUARD_REPAIR_NORMALIZE_PASS:-true}
      BOOKGUARD_REPAIR_AUDIO_ALBUM: ${BOOKGUARD_REPAIR_AUDIO_ALBUM:-true}
      BOOKGUARD_REPAIR_AUDIO_ALBUM_ARTIST: ${BOOKGUARD_REPAIR_AUDIO_ALBUM_ARTIST:-true}
      BOOKGUARD_REPAIR_AUDIO_GENRE: ${BOOKGUARD_REPAIR_AUDIO_GENRE:-false}
      BOOKGUARD_REPAIR_AUDIO_GENRE_VALUE: ${BOOKGUARD_REPAIR_AUDIO_GENRE_VALUE:-Audiobook}
      BOOKGUARD_DASHBOARD_POLL_MS: ${BOOKGUARD_DASHBOARD_POLL_MS:-1500}
      BOOKGUARD_LIVE_RESULTS_LIMIT: ${BOOKGUARD_LIVE_RESULTS_LIMIT:-20}
      BOOKGUARD_RESULT_LIMIT: ${BOOKGUARD_RESULT_LIMIT:-1000}
    volumes:
      - /mnt/cache/appdata/bookguard:/config
      - /mnt/cache/appdata/bindery:/bindery:ro
      # Keep media read-only while using preview mode. Remove :ro only after
      # deliberately switching Metadata repair mode to Safe in the UI.
      - /mnt/user/data/media/audiobooks:/audiobooks:ro
      - /mnt/user/data/media/books:/books:ro
      - /mnt/user/data/bookguard-quarantine:/quarantine
      # Pre-import staging for safe reacquisition. Bindery must be configured
      # with import.mode=external and its drop folder mapped to this same host path.
      - /mnt/user/data/bookguard-staging:/staging
