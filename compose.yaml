services:
  bookguard:
    build: .
    container_name: bookguard
    restart: unless-stopped
    # Run as the Unraid nobody:users account by default. Override UID/GID only
    # when the mounted host paths are deliberately owned by another account.
    user: "${BOOKGUARD_UID:-99}:${BOOKGUARD_GID:-100}"
    # Keep the application image immutable at runtime. Only explicit bind
    # mounts/volumes below remain writable.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No Linux capabilities are added back. Bindery's database must be readable
    # by the configured runtime UID/GID instead of bypassing DAC permissions.
    ports:
      - "${BOOKGUARD_BIND_ADDRESS:-127.0.0.1}:8788:8788"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-America/Toronto}
      BOOKGUARD_AUTH_USERNAME: ${BOOKGUARD_AUTH_USERNAME:-bookguard}
      BOOKGUARD_AUTH_PASSWORD: ${BOOKGUARD_AUTH_PASSWORD:?Set BOOKGUARD_AUTH_PASSWORD in .env}
      BINDERY_DB: ${BINDERY_DB:-/bindery/bindery.db}
      BINDERY_URL: ${BINDERY_URL:-http://host.docker.internal:8787}
      BINDERY_API_KEY: ${BINDERY_API_KEY:-}
      AUDIOBOOK_ROOT: ${AUDIOBOOK_ROOT:-/audiobooks}
      AUDIOBOOK_BINDERY_PREFIX: ${AUDIOBOOK_BINDERY_PREFIX:-/data/media/audiobooks}
      EBOOK_ROOT: ${EBOOK_ROOT:-/books}
      EBOOK_BINDERY_PREFIX: ${EBOOK_BINDERY_PREFIX:-/data/media/books}
      CONFIG_DIR: /config
      QUARANTINE_ROOT: ${QUARANTINE_ROOT:-/quarantine}
      BOOKGUARD_STAGING_ROOT: ${BOOKGUARD_STAGING_ROOT:-/staging}
      BOOKGUARD_BINDERY_DROP_FOLDER: ${BOOKGUARD_BINDERY_DROP_FOLDER:-}
      BOOKGUARD_AUTOMATIC_REACQUISITION: ${BOOKGUARD_AUTOMATIC_REACQUISITION:-false}
      BOOKGUARD_ACQUISITION_COORDINATOR_ENABLED: ${BOOKGUARD_ACQUISITION_COORDINATOR_ENABLED:-false}
      BOOKGUARD_ACQUISITION_COORDINATOR_INTERVAL_SECONDS: ${BOOKGUARD_ACQUISITION_COORDINATOR_INTERVAL_SECONDS:-10}
      BOOKGUARD_MAX_STAGED_EBOOK_BYTES: ${BOOKGUARD_MAX_STAGED_EBOOK_BYTES:-536870912}
      # Ebook quarantine/remediation uses a separate opt-in writable alias.
      # The alias is absent unless compose.actions.yaml is deliberately included.
      BOOKGUARD_EBOOK_ACTIONS_ENABLED: ${BOOKGUARD_EBOOK_ACTIONS_ENABLED:-false}
      BOOKGUARD_EBOOK_ACTION_ROOT: ${BOOKGUARD_EBOOK_ACTION_ROOT:-/action-books}
      # Direct admission is separately gated and has no writable library mount
      # unless compose.admission.yaml is deliberately included.
      BOOKGUARD_ADMISSION_ENABLED: ${BOOKGUARD_ADMISSION_ENABLED:-false}
      BOOKGUARD_ADMISSION_ROOT: ${BOOKGUARD_ADMISSION_ROOT:-/admission-books}
      BOOKGUARD_ADMISSION_BINDERY_ROOT: ${BOOKGUARD_ADMISSION_BINDERY_ROOT:-/data/media/books}
      BOOKGUARD_ALLOW_ACTIONS: ${BOOKGUARD_ALLOW_ACTIONS:-false}
      BOOKGUARD_SAMPLE_FILES: ${BOOKGUARD_SAMPLE_FILES:-3}
      BOOKGUARD_SCAN_ON_START: ${BOOKGUARD_SCAN_ON_START:-false}
      BOOKGUARD_SCAN_AUDIOBOOKS: ${BOOKGUARD_SCAN_AUDIOBOOKS:-true}
      BOOKGUARD_SCAN_EBOOKS: ${BOOKGUARD_SCAN_EBOOKS:-true}
      BOOKGUARD_PROGRESS_EVERY: ${BOOKGUARD_PROGRESS_EVERY:-10}
      BOOKGUARD_TITLE_MIN_SHARED_WORDS: ${BOOKGUARD_TITLE_MIN_SHARED_WORDS:-2}
      BOOKGUARD_AUTHOR_SURNAME_MATCH: ${BOOKGUARD_AUTHOR_SURNAME_MATCH:-true}
      BOOKGUARD_REJECT_MUSIC_MISMATCH: ${BOOKGUARD_REJECT_MUSIC_MISMATCH:-true}
      BOOKGUARD_REJECT_STRONG_MISMATCH: ${BOOKGUARD_REJECT_STRONG_MISMATCH:-true}
      BOOKGUARD_STRONG_MISMATCH_MIN_SAMPLES: ${BOOKGUARD_STRONG_MISMATCH_MIN_SAMPLES:-1}
      BOOKGUARD_STRONG_MISMATCH_CONSENSUS_PERCENT: ${BOOKGUARD_STRONG_MISMATCH_CONSENSUS_PERCENT:-67}
      # Read-only deterministic ebook validation is enabled by default.
      BOOKGUARD_VERIFICATION_ENABLED: ${BOOKGUARD_VERIFICATION_ENABLED:-true}
      BOOKGUARD_VERIFICATION_FILE_SIGNATURES: ${BOOKGUARD_VERIFICATION_FILE_SIGNATURES:-true}
      BOOKGUARD_VERIFICATION_ARCHIVE_SAFETY: ${BOOKGUARD_VERIFICATION_ARCHIVE_SAFETY:-true}
      BOOKGUARD_VERIFICATION_EPUB_STRUCTURE: ${BOOKGUARD_VERIFICATION_EPUB_STRUCTURE:-true}
      BOOKGUARD_VERIFICATION_PDF_INTEGRITY: ${BOOKGUARD_VERIFICATION_PDF_INTEGRITY:-true}
      # Optional external ClamAV daemon. Endpoint remains deployment-only.
      BOOKGUARD_VERIFICATION_MALWARE_SCAN: ${BOOKGUARD_VERIFICATION_MALWARE_SCAN:-false}
      BOOKGUARD_CLAMD_HOST: ${BOOKGUARD_CLAMD_HOST:-}
      BOOKGUARD_CLAMD_PORT: ${BOOKGUARD_CLAMD_PORT:-3310}
      BOOKGUARD_MALWARE_SCAN_TIMEOUT_SECONDS: ${BOOKGUARD_MALWARE_SCAN_TIMEOUT_SECONDS:-60}
      BOOKGUARD_MALWARE_MAX_BYTES: ${BOOKGUARD_MALWARE_MAX_BYTES:-536870912}
      BOOKGUARD_VERIFICATION_SNAPSHOT_MAX_BYTES: ${BOOKGUARD_VERIFICATION_SNAPSHOT_MAX_BYTES:-536870912}
      BOOKGUARD_METADATA_REPAIR_MODE: ${BOOKGUARD_METADATA_REPAIR_MODE:-preview}
      BOOKGUARD_REPAIR_AUDIOBOOKS: ${BOOKGUARD_REPAIR_AUDIOBOOKS:-true}
      BOOKGUARD_REPAIR_EBOOKS: ${BOOKGUARD_REPAIR_EBOOKS:-true}
      BOOKGUARD_REPAIR_NORMALIZE_PASS: ${BOOKGUARD_REPAIR_NORMALIZE_PASS:-true}
      BOOKGUARD_REPAIR_AUDIO_ALBUM: ${BOOKGUARD_REPAIR_AUDIO_ALBUM:-true}
      BOOKGUARD_REPAIR_AUDIO_ALBUM_ARTIST: ${BOOKGUARD_REPAIR_AUDIO_ALBUM_ARTIST:-true}
      BOOKGUARD_REPAIR_AUDIO_GENRE: ${BOOKGUARD_REPAIR_AUDIO_GENRE:-false}
      BOOKGUARD_REPAIR_AUDIO_GENRE_VALUE: ${BOOKGUARD_REPAIR_AUDIO_GENRE_VALUE:-Audiobook}
      BOOKGUARD_DASHBOARD_POLL_MS: ${BOOKGUARD_DASHBOARD_POLL_MS:-1500}
      BOOKGUARD_LIVE_RESULTS_LIMIT: ${BOOKGUARD_LIVE_RESULTS_LIMIT:-20}
      BOOKGUARD_RESULT_LIMIT: ${BOOKGUARD_RESULT_LIMIT:-1000}
    volumes:
      # Keep persistent BookGuard state separate from the Git checkout. Mounting
      # the repository itself at /config would give the runtime write access to
      # future build inputs such as compose.yaml and .git.
      - "${BOOKGUARD_CONFIG_HOST_PATH:-/mnt/cache/appdata/bookguard-config}:/config"
      - /mnt/cache/appdata/bindery:/bindery:ro
      # Keep media read-only while using preview mode. Remove :ro only after
      # deliberately switching Metadata repair mode to Safe in the UI.
      - /mnt/user/data/media/audiobooks:/audiobooks:ro
      - /mnt/user/data/media/books:/books:ro
      - /mnt/user/data/bookguard-quarantine:/quarantine
      # Pre-import staging for guarded, explicitly confirmed reacquisition.
      # Bindery must use external import with auto-grab disabled and map its
      # drop folder to this same host path.
      - /mnt/user/data/bookguard-staging:/staging
